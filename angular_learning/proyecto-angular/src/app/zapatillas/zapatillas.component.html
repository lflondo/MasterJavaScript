<h2>{{titulo}}</h2>
<p>Compra los tenis de la mejores marcas</p>
<ul>
    <li *ngFor="let marca of marcas; let indice = index">{{(indice + 1) + ' ' + marca}}</li>
</ul>
<p>Los tenis que tenemos disponibles:</p>
<ul>
    <li *ngFor="let calzado of zapatillas">
        <span [ngStyle]="{'text-decoration': !calzado.stock ? 'line-through': 'none'}">
            {{calzado.nombre}} - <strong>${{calzado.precio}}</strong>
            <span *ngIf="calzado.precio<=80"
                    [style.background]="calzado.precio <= 80 ? 'green': 'transparent' "
                    [style.color]="calzado.precio < 80 ? 'white': 'black' "> ¡En Oferta!</span></span>
        
    </li>
</ul>
